# ============================================================
# Logistics_FMS Main PC Environment
# Common: x86_64 PC + Jetson aarch64
# ============================================================


# ============================================================
# ROS 2 Jazzy
# ============================================================

if [ -f /opt/ros/jazzy/setup.bash ]; then
    source /opt/ros/jazzy/setup.bash
fi


# ============================================================
# Node.js / NVM
# ============================================================

export NVM_DIR="$HOME/.nvm"

if [ -s "$NVM_DIR/nvm.sh" ]; then
    source "$NVM_DIR/nvm.sh"
fi


# ============================================================
# ROS Process Kill
# ============================================================

alias roskill='
pkill -9 -f ros2 2>/dev/null || true
pkill -9 -f zenoh 2>/dev/null || true
pkill -9 -f robot_agent.py 2>/dev/null || true
echo "ROS 2 / Zenoh processes stopped"
'


# ============================================================
# Default Mode
#
# Main Domain 15
# FastDDS
# SUBNET
# ============================================================

export ROS_DOMAIN_ID=15
export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
export ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET

unset ROS_LOCALHOST_ONLY


# ============================================================
# LOCAL / ZENOH MODE
#
# Main Domain 15
# CycloneDDS
# LOCALHOST
# ============================================================

ros_local() {

    export ROS_DOMAIN_ID=15
    export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    export ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST

    unset ROS_LOCALHOST_ONLY

    ros2 daemon stop >/dev/null 2>&1 || true
    ros2 daemon start >/dev/null 2>&1 || true

    echo "================================="
    echo " MAIN LOCAL / ZENOH MODE"
    echo "================================="
    echo "DOMAIN    : $ROS_DOMAIN_ID"
    echo "RMW       : $RMW_IMPLEMENTATION"
    echo "DISCOVERY : $ROS_AUTOMATIC_DISCOVERY_RANGE"
    echo "================================="
}


# ============================================================
# NORMAL MODE
#
# Main Domain 15
# FastDDS
# SUBNET
# ============================================================

ros_normal() {

    export ROS_DOMAIN_ID=15
    export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    export ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET

    unset ROS_LOCALHOST_ONLY

    ros2 daemon stop >/dev/null 2>&1 || true
    ros2 daemon start >/dev/null 2>&1 || true

    echo "================================="
    echo " MAIN NORMAL MODE"
    echo "================================="
    echo "DOMAIN    : $ROS_DOMAIN_ID"
    echo "RMW       : $RMW_IMPLEMENTATION"
    echo "DISCOVERY : $ROS_AUTOMATIC_DISCOVERY_RANGE"
    echo "================================="
}


# ============================================================
# Main Information
# ============================================================

main_info() {

    local DEFAULT_IFACE
    local DEFAULT_IP

    DEFAULT_IFACE="$(
        ip route show default \
            | sort -nk5 \
            | awk 'NR == 1 {print $5}'
    )"

    if [ -n "$DEFAULT_IFACE" ]; then

        DEFAULT_IP="$(
            ip -4 -o addr show dev "$DEFAULT_IFACE" scope global \
                | awk 'NR == 1 {
                    split($4, a, "/")
                    print a[1]
                }'
        )"

    else
        DEFAULT_IP="NOT FOUND"
    fi

    echo "================================="
    echo " MAIN SYSTEM INFO"
    echo "================================="
    echo "HOSTNAME        : $(hostname)"
    echo "ARCH            : $(uname -m)"
    echo "INTERFACE       : ${DEFAULT_IFACE:-NOT FOUND}"
    echo "IP ADDRESS      : $DEFAULT_IP"
    echo "ROS_DISTRO      : ${ROS_DISTRO:-NOT SET}"
    echo "ROS_DOMAIN_ID   : ${ROS_DOMAIN_ID:-NOT SET}"
    echo "RMW             : ${RMW_IMPLEMENTATION:-DEFAULT}"
    echo "DISCOVERY_RANGE : ${ROS_AUTOMATIC_DISCOVERY_RANGE:-DEFAULT}"
    echo "NODE            : $(node -v 2>/dev/null || echo NOT FOUND)"
    echo "NPM             : $(npm -v 2>/dev/null || echo NOT FOUND)"
    echo "================================="
}
